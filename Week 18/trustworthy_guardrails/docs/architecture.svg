<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1010" width="920" height="1010" font-family="Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b36b00"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs><rect width="920" height="1010" fill="#fff"/><text x="20" y="34" font-size="19" font-weight="700" fill="#111">Guardrail architecture - Everest Digital Bank support assistant</text><g transform="translate(0,50)"><rect x="210" y="90" width="340" height="295" rx="12" fill="#f5f9ff" stroke="#2f6db5" stroke-width="2" stroke-dasharray="7 4"/><text x="222" y="108" font-size="12" font-weight="700" fill="#2f6db5">INPUT GUARDRAILS</text><rect x="210" y="570" width="340" height="305" rx="12" fill="#f4fbf6" stroke="#2e8b57" stroke-width="2" stroke-dasharray="7 4"/><text x="222" y="588" font-size="12" font-weight="700" fill="#2e8b57">OUTPUT GUARDRAILS</text><rect x="230" y="20" width="300" height="46" rx="8" fill="#fff7e0" stroke="#b58900" stroke-width="1.5"/><text x="380.0" y="34.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">User message</text><text x="380.0" y="51.0" text-anchor="middle" font-size="11.5" fill="#444">raw text from the chat UI</text><rect x="230" y="120" width="300" height="50" rx="8" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.5"/><text x="380.0" y="136.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">0  Size check</text><text x="380.0" y="153.0" text-anchor="middle" font-size="11.5" fill="#444">reject messages > 2000 chars</text><rect x="230" y="185" width="300" height="50" rx="8" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.5"/><text x="380.0" y="201.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">1  PII detection + redaction</text><text x="380.0" y="218.0" text-anchor="middle" font-size="11.5" fill="#444">email, phone, card (Luhn), IDs -> [TYPE]</text><rect x="230" y="250" width="300" height="50" rx="8" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.5"/><text x="380.0" y="266.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">2  Prompt-injection detector</text><text x="380.0" y="283.0" text-anchor="middle" font-size="11.5" fill="#444">weighted rules, noisy-OR score</text><rect x="230" y="315" width="300" height="50" rx="8" fill="#e8f1fb" stroke="#2f6db5" stroke-width="1.5"/><text x="380.0" y="331.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">3  Sensitive-topic classifier</text><text x="380.0" y="348.0" text-anchor="middle" font-size="11.5" fill="#444">self-harm, illegal, 3rd-party, legal, invest.</text><path d="M380,66 L380,120" fill="none" stroke="#333" stroke-width="1.6"  marker-end="url(#a)"/><path d="M380,170 L380,185" fill="none" stroke="#333" stroke-width="1.6"  marker-end="url(#a)"/><path d="M380,235 L380,250" fill="none" stroke="#333" stroke-width="1.6"  marker-end="url(#a)"/><path d="M380,300 L380,315" fill="none" stroke="#333" stroke-width="1.6"  marker-end="url(#a)"/><path d="M380,365 L380,415" fill="none" stroke="#333" stroke-width="1.6"  marker-end="url(#a)"/><rect x="650" y="200" width="230" height="100" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.5"/><text x="765.0" y="220.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">BLOCK / REFUSE / CRISIS</text><text x="765.0" y="237.0" text-anchor="middle" font-size="11.5" fill="#444">injection score >= 0.70,</text><text x="765.0" y="251.0" text-anchor="middle" font-size="11.5" fill="#444">illegal or 3rd-party topic,</text><text x="765.0" y="265.0" text-anchor="middle" font-size="11.5" fill="#444">self-harm -> crisis text</text><text x="765.0" y="279.0" text-anchor="middle" font-size="11.5" fill="#444">(returned straight to user)</text><text x="650" y="195" font-size="10.5" fill="#c0392b">stops before the model is called</text><path d="M530,145 L620,145 L620,250 L650,250" fill="none" stroke="#c0392b" stroke-width="1.6"  marker-end="url(#r)"/><path d="M530,275 L620,275 L620,250" fill="none" stroke="#c0392b" stroke-width="1.6" /><path d="M530,340 L620,340 L620,250" fill="none" stroke="#c0392b" stroke-width="1.6" /><rect x="230" y="415" width="300" height="46" rx="8" fill="#f1f1f1" stroke="#444" stroke-width="1.5"/><text x="380.0" y="429.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Retrieval</text><text x="380.0" y="446.0" text-anchor="middle" font-size="11.5" fill="#444">top-2 reference docs from knowledge base</text><rect x="230" y="485" width="300" height="56" rx="8" fill="#f1f1f1" stroke="#444" stroke-width="1.5"/><text x="380.0" y="504.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">LLM (mock or real)</text><text x="380.0" y="521.0" text-anchor="middle" font-size="11.5" fill="#444">system prompt + canary; hardened if flagged</text><path d="M380,461 L380,485" fill="none" stroke="#333" stroke-width="1.6"  marker-end="url(#a)"/><path d="M380,541 L380,600" fill="none" stroke="#333" stroke-width="1.6"  marker-end="url(#a)"/><rect x="230" y="600" width="300" height="50" rx="8" fill="#e9f6ec" stroke="#2e8b57" stroke-width="1.5"/><text x="380.0" y="616.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">A  Leak / secret scan</text><text x="380.0" y="633.0" text-anchor="middle" font-size="11.5" fill="#444">canary, API keys, prompt phrases</text><rect x="230" y="665" width="300" height="50" rx="8" fill="#e9f6ec" stroke="#2e8b57" stroke-width="1.5"/><text x="380.0" y="681.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">B  Schema validation</text><text x="380.0" y="698.0" text-anchor="middle" font-size="11.5" fill="#444">JSON fields, types, enum, sources</text><rect x="230" y="730" width="300" height="50" rx="8" fill="#e9f6ec" stroke="#2e8b57" stroke-width="1.5"/><text x="380.0" y="746.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">C  PII redaction</text><text x="380.0" y="763.0" text-anchor="middle" font-size="11.5" fill="#444">redact PII in answer; public contacts ok</text><rect x="230" y="795" width="300" height="50" rx="8" fill="#e9f6ec" stroke="#2e8b57" stroke-width="1.5"/><text x="380.0" y="811.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">D  Groundedness check</text><text x="380.0" y="828.0" text-anchor="middle" font-size="11.5" fill="#444">coverage + numbers + negation per claim</text><path d="M380,650 L380,665" fill="none" stroke="#333" stroke-width="1.6"  marker-end="url(#a)"/><path d="M380,715 L380,730" fill="none" stroke="#333" stroke-width="1.6"  marker-end="url(#a)"/><path d="M380,780 L380,795" fill="none" stroke="#333" stroke-width="1.6"  marker-end="url(#a)"/><rect x="650" y="690" width="230" height="90" rx="8" fill="#fdeceb" stroke="#c0392b" stroke-width="1.5"/><text x="765.0" y="712.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">SAFE FALLBACK</text><text x="765.0" y="729.0" text-anchor="middle" font-size="11.5" fill="#444">leak found: immediately</text><text x="765.0" y="743.0" text-anchor="middle" font-size="11.5" fill="#444">or retries used up;</text><text x="765.0" y="757.0" text-anchor="middle" font-size="11.5" fill="#444">message points to helpline</text><path d="M530,625 L620,625 L620,715 L650,715" fill="none" stroke="#c0392b" stroke-width="1.6"  marker-end="url(#r)"/><text x="538" y="618" font-size="10.5" fill="#c0392b">leak: block</text><path d="M530,835 L620,835 L620,760 L650,760" fill="none" stroke="#c0392b" stroke-width="1.6"  marker-end="url(#r)"/><text x="538" y="852" font-size="10.5" fill="#c0392b">retries used up</text><path d="M530,690 L585,690 L585,513 L530,513" fill="none" stroke="#b36b00" stroke-width="1.6"  marker-end="url(#o)"/><path d="M530,820 L585,820 L585,690" fill="none" stroke="#b36b00" stroke-width="1.6" /><text x="592" y="560" font-size="10.5" fill="#b36b00">fail at B or D:</text><text x="592" y="573" font-size="10.5" fill="#b36b00">regenerate once</text><rect x="230" y="900" width="300" height="46" rx="8" fill="#fff7e0" stroke="#b58900" stroke-width="1.5"/><text x="380.0" y="914.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">Response to user</text><text x="380.0" y="931.0" text-anchor="middle" font-size="11.5" fill="#444">validated answer (+ disclaimer if legal / investment)</text><path d="M380,845 L380,900" fill="none" stroke="#333" stroke-width="1.6"  marker-end="url(#a)"/><path d="M765,780 L765,923 L530,923" fill="none" stroke="#c0392b" stroke-width="1.6"  marker-end="url(#r)"/><rect x="20" y="90" width="150" height="785" rx="10" fill="#f1f1f1" stroke="#666" stroke-width="1.5"/><text x="95" y="130" text-anchor="middle" font-size="14" font-weight="700">AUDIT LOG</text><text x="95" y="152" text-anchor="middle" font-size="11.5" fill="#444">hash-chained</text><text x="95" y="168" text-anchor="middle" font-size="11.5" fill="#444">(tamper-evident)</text><text x="95" y="184" text-anchor="middle" font-size="11.5" fill="#444"></text><text x="95" y="200" text-anchor="middle" font-size="11.5" fill="#444">stores REDACTED</text><text x="95" y="216" text-anchor="middle" font-size="11.5" fill="#444">text only</text><path d="M210,245 L170,245" fill="none" stroke="#666" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#g)"/><path d="M230,513 L170,513" fill="none" stroke="#666" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#g)"/><path d="M210,725 L170,725" fill="none" stroke="#666" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#g)"/></g></svg>