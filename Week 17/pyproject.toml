[project]
name = "fuse-week17-mlops"
version = "0.1.0"
description = "Week 17 MLOps for Telco churn and the Week 15/16 grading assistant"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.6", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "protobuf>=6.33.5,<8",
  "transformers<5", "torch>=2.6", "sentence-transformers>=3.4",
  "scikit-learn>=1.6,<2", "pandas>=2.2,<3", "numpy>=1.26,<3",
  "matplotlib>=3.9,<4", "joblib>=1.4,<2", "PyPDF2>=3.0", "pdf2image>=1.17",
  "Pillow>=11", "google-genai==2.22.0", "httpx>=0.28,<1", "requests>=2.32,<3",
  "sentencepiece>=0.2", "tiktoken>=0.8", "chromadb>=0.6", "streamlit==1.50.0",
  "mlflow==2.22.0", "evidently[llm]>=0.4.40,<0.5", "openai>=1.60,<3"
]
[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-cov>=6", "ruff>=0.9"]
[tool.uv]
package = false
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
